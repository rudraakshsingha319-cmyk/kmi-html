<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta content="KMI BY JS — Khowai Modeling Institute. Professional modeling, grooming, runway, pageant preparation, and portfolio development." name="description"/>
    <meta content="#080808" name="theme-color"/>
    <title>KMI BY JS | Khowai Modeling Institute</title>

    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@0,600;0,700;1,600&amp;display=swap" rel="stylesheet"/>

    <style>
        :root {
            --bg-dark: #080808;
            --bg-card: #121212;
            --bg-light: #f5f3ef;
            --gold-primary: #d8ad52;
            --gold-light: #f0c86b;
            --gold-dim: rgba(216, 173, 82, 0.15);
            --text-light: #ffffff;
            --text-dark: #111111;
            --text-muted: rgba(255, 255, 255, 0.65);
            --border-gold: rgba(216, 173, 82, 0.3);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        *{box-sizing:border-box;margin:0;padding:0}
        html{scroll-behavior:smooth}
        body{font-family:"DM Sans",sans-serif;color:var(--text-dark);background:var(--bg-light);line-height:1.6;overflow-x:hidden}
        a{text-decoration:none;color:inherit}
        img{display:block;max-width:100%;height:auto}

        /* Typography */
        h1, h2, h3, .serif {
            font-family: 'Playfair Display', serif;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 5%;
            background: rgba(8, 8, 8, 0.9);
            backdrop-filter: blur(12px);
            color: var(--text-light);
            border-bottom: 1px solid rgba(216, 173, 82, 0.1);
        }

        .brand {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .brand-mark {
            border: 1px solid var(--gold-primary);
            padding: 6px 10px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--gold-primary);
            font-family: 'Playfair Display', serif;
        }

        .brand b, .brand small { display: block; }
        .brand b { font-size: 13px; letter-spacing: 1px; }
        .brand small { font-size: 9px; opacity: 0.65; letter-spacing: 0.5px; }

        .nav {
            display: flex;
            align-items: center;
            gap: 28px;
            font-size: 13px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .nav a {
            opacity: 0.8;
            transition: var(--transition);
        }

        .nav a:hover {
            opacity: 1;
            color: var(--gold-light);
        }

        .nav-cta {
            border: 1px solid var(--gold-primary);
            padding: 9px 18px !important;
            color: var(--gold-light);
            transition: var(--transition) !important;
            opacity: 1 !important;
        }

        .nav-cta:hover {
            background: var(--gold-primary);
            color: var(--bg-dark) !important;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: 0;
            color: #fff;
            font-size: 25px;
            cursor: pointer;
        }

            padding: 150px 7% 90px;
